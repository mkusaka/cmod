name: Test

on:
  workflow_call:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      test: ${{ steps.default.outputs.test || steps.filter.outputs.test || 'false' }}
    steps:
      - name: Enable tests for reusable workflow calls
        id: default
        if: github.event_name == 'workflow_call'
        run: echo "test=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: github.event_name != 'workflow_call'
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect files changed from main
        id: filter
        if: github.event_name != 'workflow_call'
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          base: main
          filters: |
            test:
              - 'Cmod/**'
              - 'Cmod.xcodeproj/**'
              - 'CmodTests/**'
              - 'Config/**'
              - 'Dependencies/**'
              - 'scripts/**'
              - 'mise.toml'
              - 'lefthook.yml'
              - 'renovate.json5'
              - '.swiftformat'
              - '.swiftlint.yml'
              - '.github/workflows/test.yml'
              - '.github/workflows/release.yml'

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          version: 2026.3.9
          cache: true

      - name: SwiftFormat check
        run: mise exec -- swiftformat --lint .

      - name: SwiftLint check
        run: mise exec -- swiftlint lint --quiet

      - name: GitHub Actions lint
        run: mise exec -- actionlint

      - name: GitHub Actions security lint
        run: mise exec -- zizmor --offline .

      - name: GitHub Actions pin check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise exec -- pinact run --check

  unit-test:
    name: Unit Tests
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run unit tests
        run: |
          xcodebuild -project Cmod.xcodeproj \
            -scheme Cmod \
            -destination 'platform=macOS' \
            -only-testing:CmodTests \
            test \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
