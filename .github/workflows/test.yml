name: Test
on:
  workflow_call:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  lint:
    name: Lint
    runs-on: macos-26
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode with Swift 6.2
        run: |
          if [[ -d /Applications/Xcode_26.2.app ]]; then
            sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          else
            echo "::error::Xcode 26.2 is required for Swift 6.2"
            find /Applications -maxdepth 1 -name 'Xcode*.app' -print
            exit 1
          fi
      - name: Print tool versions
        run: |
          xcodebuild -version
          swift --version
          swift --version | grep -q 'Swift version 6\.2'
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.13
          cache: true
      - name: SwiftFormat check
        run: mise exec -- swiftformat --lint .
      - name: SwiftLint check
        run: mise exec -- swiftlint lint --quiet
      - name: GitHub Actions lint
        run: mise exec -- actionlint
      - name: GitHub Actions security lint
        run: mise exec -- zizmor --offline .
      - name: GitHub Actions pin check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise exec -- pinact run --check
    timeout-minutes: 60
  unit-test:
    name: Unit Tests (${{ matrix.macos-version }})
    runs-on: ${{ matrix.macos-version }}
    strategy:
      fail-fast: false
      matrix:
        macos-version:
          - macos-15
          - macos-26
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode with Swift 6.2
        run: |
          if [[ -d /Applications/Xcode_26.2.app ]]; then
            sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          else
            echo "::error::Xcode 26.2 is required for Swift 6.2"
            find /Applications -maxdepth 1 -name 'Xcode*.app' -print
            exit 1
          fi
      - name: Print tool versions
        run: |
          xcodebuild -version
          swift --version
          swift --version | grep -q 'Swift version 6\.2'
      - name: Run unit tests
        run: |
          xcodebuild -project Cmod.xcodeproj \
            -scheme Cmod \
            -destination 'platform=macOS' \
            -only-testing:CmodTests \
            test \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
    timeout-minutes: 60
  ui-test:
    name: UI Tests (${{ matrix.macos-version }})
    runs-on: ${{ matrix.macos-version }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        macos-version:
          - macos-15
          - macos-26
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode with Swift 6.2
        run: |
          if [[ -d /Applications/Xcode_26.2.app ]]; then
            sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          else
            echo "::error::Xcode 26.2 is required for Swift 6.2"
            find /Applications -maxdepth 1 -name 'Xcode*.app' -print
            exit 1
          fi
      - name: Print tool versions
        run: |
          xcodebuild -version
          swift --version
          swift --version | grep -q 'Swift version 6\.2'
      - name: Run UI tests
        run: |
          xcodebuild -project Cmod.xcodeproj \
            -scheme Cmod \
            -destination 'platform=macOS' \
            -only-testing:CmodUITests \
            test \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=
