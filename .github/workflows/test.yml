name: Test

on:
  workflow_call:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          version: 2026.5.5
          cache: true

      - name: SwiftFormat check
        run: mise exec -- swiftformat --lint .

      - name: SwiftLint check
        run: mise exec -- swiftlint lint --quiet

      - name: GitHub Actions lint
        run: mise exec -- actionlint

      - name: GitHub Actions security lint
        run: mise exec -- zizmor --offline .

      - name: GitHub Actions pin check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise exec -- pinact run --check

  unit-test:
    name: Unit Tests (${{ matrix.macos-version }})
    runs-on: ${{ matrix.macos-version }}
    strategy:
      fail-fast: false
      matrix:
        macos-version:
          - macos-15
          - macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run unit tests
        run: |
          xcodebuild -project Cmod.xcodeproj \
            -scheme Cmod \
            -destination 'platform=macOS' \
            -only-testing:CmodTests \
            test \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
